name: Container image

# Publishes the scripts as ghcr.io/<owner>/remarkable-scripts on every push to main:
# `latest` moves with main, `sha-<short sha>` stays put for pinning or rollback.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/remarkable-scripts:latest
            ghcr.io/${{ github.repository_owner }}/remarkable-scripts:sha-${{ env.SHORT_SHA }}
          push: true

      - name: Check the tools are present
        run: |
          docker run --rm "ghcr.io/${{ github.repository_owner }}/remarkable-scripts:sha-$SHORT_SHA" \
            bash -c 'for t in offlineimap munpack inotifywait curl; do command -v "$t" >/dev/null || { echo "missing $t"; exit 1; }; done; for s in /app/*.sh; do bash -n "$s" || exit 1; done'
